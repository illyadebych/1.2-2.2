<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Апроксимація: Лагранж та МНК</title>
    <!-- Підключаємо CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">
        <div class="controls">
            <h2>Налаштування</h2>
            
            <h3>Набір даних</h3>
            <div class="btn-group" id="data-btns">
                <button data-size="5" class="active">5 Точок</button>
                <button data-size="10">10 Точок</button>
                <button data-size="20">20 Точок</button>
            </div>

            <h3>Відображення</h3>
            <div class="btn-group" id="view-btns">
                <button data-view="lagrange">Інтерполяція (Лагранж)</button>
                <button data-view="mnc">Апроксимація (МНК)</button>
                <button data-view="all" class="active">Усі графіки</button>
            </div>

            <h3>Анімація</h3>
            <div class="btn-group">
                <button id="btn-anim-lagrange">Анімувати Лагранжа</button>
                <button id="btn-anim-mnc">Анімувати МНК</button>
            </div>

            <div class="metrics">
                <strong>MSE (МНК): </strong> <span id="mse-val">0.000</span>
            </div>

            <div class="legend">
                <div class="legend-item"><div class="color-box" style="background: var(--lagrange)"></div> Лагранж</div>
                <div class="legend-item"><div class="color-box" style="background: var(--mnc)"></div> МНК</div>
                <div class="legend-item"><div class="color-box" style="background: var(--error)"></div> Залишки</div>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="plot"></canvas>
            <div id="tooltip"></div>
        </div>
    </div>

    <!-- Підключаємо JavaScript в самому кінці -->
    <script src="script.js"></script>
</body>
</html>
